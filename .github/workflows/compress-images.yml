name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/compress-images.mjs"
      - "scripts/generate-blur.mjs"
      - ".github/workflows/compress-images.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/compress-images.mjs"
      - "scripts/generate-blur.mjs"
      - ".github/workflows/compress-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compress oversized images
        run: npm run compress:images

      - name: Generate blur placeholders
        run: npm run generate:blur

      - name: Commit optimized images
        run: |
          if git diff --quiet -- public/ lib/blur-data.json; then
            echo "No image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ lib/blur-data.json
          git commit -m "chore: optimize images (compress + blur) [skip ci]"
          git push
